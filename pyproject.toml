[project]
name = "nse-warehouse"
version = "0.1.0"
description = "Ingests NSE daily equity bhavcopy into BigQuery, models it with dbt, and orchestrated with Airflow"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-cloud-bigquery[pandas]>=3.45.0",
    "nse==3.1.1",
    "pandas>=3.0.5",
    "tenacity>=9.1.4",
]
